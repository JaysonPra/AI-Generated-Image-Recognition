experiment:
  experiment_name: "AI_vs_Real_Detection"
  run_name: "resnet18_dummy"
  n_trials: 10

training:
  epochs: 5
  n_splits: 5
  batch_size: 8
  batch_size_options: [4, 8, 16]

  lr_range: [0.00001, 0.001]

  optimizer: "Adam"
  optimizer_params: {}

  fine_tune: true

  augmentations:
    horizontalflip:
      parameters:
        p: 0.5
    rotation:
      parameters:
        degrees: 15
